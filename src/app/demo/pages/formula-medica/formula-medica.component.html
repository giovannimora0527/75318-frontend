<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3><i class="fa fa-file-medical"></i> &nbsp; Gestión de Fórmulas Médicas</h3>
    </div>

    <div class="card-body">
      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="guardarFormula()" class="mb-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label>Descripción</label>
            <input type="text" class="form-control" formControlName="descripcion" placeholder="Ej. Paracetamol 500mg" />
          </div>

          <div class="col-md-6">
            <label>Fecha de Emisión</label>
            <input type="date" class="form-control" formControlName="fechaEmision" />
          </div>

          <div class="col-md-6">
            <label>ID Médico</label>
            <input type="number" class="form-control" formControlName="medicoId" />
          </div>

          <div class="col-md-6">
            <label>ID Paciente</label>
            <input type="number" class="form-control" formControlName="pacienteId" />
          </div>
        </div>

        <div class="mt-3 text-end">
          <button type="submit" class="btn btn-primary me-2" [disabled]="cargando">
            {{ editando ? 'Actualizar' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-secondary" *ngIf="editando" (click)="cancelarEdicion()">Cancelar</button>
        </div>
      </form>

      <hr />

      <!-- Spinner -->
      <div *ngIf="cargando" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <!-- Tabla -->
      <div *ngIf="!cargando" class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descripción</th>
              <th>Fecha Emisión</th>
              <th>Médico</th>
              <th>Paciente</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let f of formulas">
              <td>{{ f.id }}</td>
              <td>{{ f.descripcion }}</td>
              <td>{{ f.fechaEmision | date }}</td>
              <td>{{ f.medicoId }}</td>
              <td>{{ f.pacienteId }}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-2" (click)="editarFormula(f)">
                  <i class="fa fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="eliminarFormula(f.id!)">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
