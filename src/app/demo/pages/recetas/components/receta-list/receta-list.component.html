<p>receta-list works!</p>

<div class="container">
  <h2>Listado de Recetas</h2>

  <button routerLink="/recetas/nuevo" class="btn btn-primary">Nueva Receta</button>

  <table *ngIf="!loading && recetas?.length" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cita</th>
        <th>Medicamento</th>
        <th>Dosis</th>
        <th>Indicaciones</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of recetas">
        <td>{{ r.id }}</td>
        <td>{{ r.cita?.id || '-' }}</td>
        <td>{{ r.medicamento?.nombre || r.medicamento?.id || '-' }}</td>
        <td>{{ r.dosis }}</td>
        <td>{{ r.indicaciones }}</td>
        <td>{{ r.fechaCreacionRegistro | date:'short' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && (!recetas || recetas.length === 0)">
    No hay recetas registradas.
  </div>
</div>
