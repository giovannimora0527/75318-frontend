<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Historias Médicas</h4>
  <button class="btn btn-primary" (click)="abrirNuevaHistoria()">Nueva Historia</button>
</div>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead class="table-light">
      <tr>
        <th>Fecha</th>
        <th>Paciente</th>
        <th>Médico</th>
        <th>Motivo</th>
        <th>Diagnóstico</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let h of historias">
        <td>{{ h.fecha }}</td>
        <td>{{ h.idPaciente }}</td>
        <td>{{ h.idMedico }}</td>
        <td>{{ h.motivoConsulta }}</td>
        <td>{{ h.diagnostico }}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-info" (click)="abrirEditarHistoria(h)">
            <i class="feather icon-edit"></i> Editar
          </button>
        </td>
      </tr>
      <tr *ngIf="!historias || historias.length === 0">
        <td colspan="6" class="text-center text-muted">No hay historias médicas registradas</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal fade" id="modalHistoria" tabindex="-1" aria-labelledby="modalHistoriaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalHistoriaLabel">{{ titleModal }}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="guardarHistoria()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">ID Paciente</label>
              <input type="number" class="form-control" formControlName="idPaciente" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">ID Médico</label>
              <input type="number" class="form-control" formControlName="idMedico" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control" formControlName="fecha" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Motivo de Consulta</label>
              <input type="text" class="form-control" formControlName="motivoConsulta" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Antecedentes</label>
            <textarea class="form-control" formControlName="antecedentes" rows="2"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Diagnóstico</label>
            <input type="text" class="form-control" formControlName="diagnostico" />
          </div>

          <div class="mb-3">
            <label class="form-label">Tratamiento</label>
            <textarea class="form-control" formControlName="tratamiento" rows="2"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <textarea class="form-control" formControlName="observaciones" rows="2"></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Cerrar</button>
            <button type="submit" class="btn btn-primary">{{ titleBoton }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
