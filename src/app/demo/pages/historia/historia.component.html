<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3>
          <i class="fa fa-calendar"></i>
          &nbsp;Historias médicas
        </h3>

        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalCrearHistorias">
          <i class="fa fa-plus"></i>
          Nueva historia
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Paciente</th>
              <th>Fecha Creación</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let historia of historias">
              <td>{{ historia.id }}</td>
              <td>{{ historia.paciente_id }}</td> 
              <td>{{ historia.fechaCreacion }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalCrearHistorias" tabindex="-1" aria-labelledby="modalCrearHistoriasLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalCrearHistoriasLabel">Nueva historia</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Contenido de ejemplo del modal.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
