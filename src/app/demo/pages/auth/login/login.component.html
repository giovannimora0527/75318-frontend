<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-gradient p-4">
  <div class="w-100" style="max-width: 450px;">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <div class="d-inline-block p-3 bg-primary bg-opacity-10 rounded-circle mb-3">
            <i class="fa fa-hospital fa-3x text-primary"></i>
          </div>
          <h2 class="fw-bold text-dark">Clínica Uniminuto</h2>
          <p class="text-muted">Ingresa tus credenciales</p>
        </div>

        <div *ngIf="mensajeError" class="alert alert-danger rounded-3 mb-3" role="alert">
          <i class="fa fa-exclamation-circle"></i> {{ mensajeError }}
          <div *ngIf="intentosRestantes !== null && !usuarioBloqueado" class="mt-2 small">
            <strong>Intentos restantes: {{ intentosRestantes }}</strong>
          </div>
        </div>

        <div *ngIf="mensajeExito" class="alert alert-success rounded-3 mb-3" role="alert">
          <i class="fa fa-check-circle"></i> {{ mensajeExito }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">
              <i class="fa fa-user"></i> Usuario
            </label>
            <input
              type="text"
              id="username"
              formControlName="username"
              class="form-control form-control-lg rounded-3"
              [class.is-invalid]="username?.invalid && username?.touched"
              placeholder="Ingresa tu usuario"
            >
            <div *ngIf="username?.invalid && username?.touched" class="invalid-feedback">
              <span *ngIf="username?.errors?.['required']">El usuario es requerido</span>
              <span *ngIf="username?.errors?.['minlength']">Mínimo 3 caracteres</span>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">
              <i class="fa fa-lock"></i> Contraseña
            </label>
            <div class="input-group">
              <input
                [type]="mostrarPassword ? 'text' : 'password'"
                id="password"
                formControlName="password"
                class="form-control form-control-lg rounded-start-3"
                [class.is-invalid]="password?.invalid && password?.touched"
                placeholder="Ingresa tu contraseña"
              >
              <button
                type="button"
                class="btn btn-outline-secondary rounded-end-3"
                (click)="togglePassword()"
              >
                <i [class]="mostrarPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
              </button>
            </div>
            <div *ngIf="password?.invalid && password?.touched" class="text-danger small mt-1">
              <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
              <span *ngIf="password?.errors?.['minlength']">Mínimo 4 caracteres</span>
            </div>
          </div>

          <div class="text-end mb-3">
            <a routerLink="/recuperar-password" class="text-decoration-none small">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold"
            [disabled]="loginForm.invalid || cargando"
          >
            <span *ngIf="!cargando">
              <i class="fa fa-sign-in-alt"></i> Iniciar Sesión
            </span>
            <span *ngIf="cargando">
              <i class="fa fa-spinner fa-spin"></i> Ingresando...
            </span>
          </button>
        </form>

        <div class="mt-4 pt-4 border-top text-center">
          <p class="text-muted small mb-0">
            Sistema de Gestión Clínica
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
