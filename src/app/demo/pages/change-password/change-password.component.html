<!-- Spinner de carga -->
<ngx-spinner type="ball-fussion" size="medium" color="#fff">
  <p>Cambiando contraseña...</p>
</ngx-spinner>

<div class="login-container">
  <div class="container-fluid">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0">
          
          <!-- Header -->
          <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0">
              <i class="fa fa-key"></i>
              &nbsp;Cambiar Contraseña
            </h3>
          </div>

          <!-- Body -->
          <div class="card-body p-4">
            <form [formGroup]="changeForm" (ngSubmit)="onSubmit()">

              <!-- Contraseña actual -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="fa fa-lock"></i>
                  &nbsp;Contraseña Actual
                </label>
                <input 
                  [type]="mostrarPassword ? 'text' : 'password'"
                  class="form-control"
                  formControlName="passwordActual"
                  placeholder="Ingrese su contraseña actual"
                  [class.is-invalid]="f['passwordActual'].invalid && (f['passwordActual'].dirty || f['passwordActual'].touched)"
                />
                <div *ngIf="f['passwordActual'].invalid && (f['passwordActual'].dirty || f['passwordActual'].touched)" class="invalid-feedback d-block">
                  <small *ngIf="f['passwordActual'].errors?.['required']">La contraseña actual es requerida.</small>
                  <small *ngIf="f['passwordActual'].errors?.['minlength']">Mínimo 6 caracteres.</small>
                </div>
              </div>

              <!-- Nueva contraseña -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="fa fa-lock"></i>
                  &nbsp;Nueva Contraseña
                </label>
                <input 
                  [type]="mostrarPassword ? 'text' : 'password'"
                  class="form-control"
                  formControlName="passwordNueva"
                  placeholder="Ingrese su nueva contraseña"
                  [class.is-invalid]="f['passwordNueva'].invalid && (f['passwordNueva'].dirty || f['passwordNueva'].touched)"
                />
                <div *ngIf="f['passwordNueva'].invalid && (f['passwordNueva'].dirty || f['passwordNueva'].touched)" class="invalid-feedback d-block">
                  <small *ngIf="f['passwordNueva'].errors?.['required']">La nueva contraseña es requerida.</small>
                  <small *ngIf="f['passwordNueva'].errors?.['minlength']">Mínimo 6 caracteres.</small>
                </div>
              </div>

              <!-- Confirmar contraseña -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="fa fa-lock"></i>
                  &nbsp;Confirmar Contraseña
                </label>
                <input 
                  [type]="mostrarPassword ? 'text' : 'password'"
                  class="form-control"
                  formControlName="passwordConfirm"
                  placeholder="Confirme su nueva contraseña"
                  [class.is-invalid]="f['passwordConfirm'].invalid && (f['passwordConfirm'].dirty || f['passwordConfirm'].touched)"
                />
                <div *ngIf="f['passwordConfirm'].invalid && (f['passwordConfirm'].dirty || f['passwordConfirm'].touched)" class="invalid-feedback d-block">
                  <small *ngIf="f['passwordConfirm'].errors?.['required']">Debe confirmar la contraseña.</small>
                  <small *ngIf="f['passwordConfirm'].errors?.['mismatch']">Las contraseñas no coinciden.</small>
                </div>
              </div>

              <!-- Mostrar contraseña -->
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="mostrarPassword" (change)="toggleMostrarPassword()">
                <label class="form-check-label" for="mostrarPassword">
                  Mostrar contraseñas
                </label>
              </div>

              <!-- Botón de guardar -->
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="changeForm.invalid || isLoading">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                  <i *ngIf="!isLoading" class="fa fa-save me-2"></i>
                  {{ isLoading ? 'Guardando...' : 'Guardar cambios' }}
                </button>
              </div>

            </form>
          </div>

          <!-- Footer -->
          <div class="card-footer text-center text-muted py-3">
            <small>
              <i class="fa fa-shield-alt"></i>
              &nbsp;Sistema seguro de autenticación
            </small>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
