<div class="container mt-4">
  <h2>Auditoría de Recuperación de Contraseñas</h2>

  <div *ngIf="loading">Cargando registros...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <table *ngIf="!loading && registros.length" class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Acción</th>
        <th>Descripción</th>
        <th>IP</th>
        <th>Fecha y Hora</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let reg of registros">
        <td>{{ reg.id }}</td>
        <td>{{ reg.usuario }}</td>
        <td>{{ reg.accion }}</td>
        <td>{{ reg.descripcion }}</td>
        <td>{{ reg.ip }}</td>
        <td>{{ reg.fechaHora | date:'short' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !registros.length">No hay registros disponibles.</div>
</div>
