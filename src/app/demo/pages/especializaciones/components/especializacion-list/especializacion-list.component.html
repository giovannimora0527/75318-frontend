<p>especializacion-list works!</p>

<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Especializaciones</h4>
    <div>
      <button class="btn btn-primary" routerLink="/especializaciones/nuevo">Nueva especialización</button>
    </div>
  </div>

  <div class="mb-3 row g-2">
    <div class="col-auto">
      <input class="form-control" placeholder="Buscar por código" [(ngModel)]="filtro">
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-secondary" (click)="buscarPorCodigo()">Buscar</button>
      <button class="btn btn-outline-secondary ms-2" (click)="cargar()">Ver todas</button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>
  </div>

  <table *ngIf="!loading && especializaciones?.length" class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Código</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of especializaciones">
        <td>{{ e.id }}</td>
        <td>{{ e.nombre }}</td>
        <td>{{ e.codigoEspecializacion }}</td>
        <td>{{ e.descripcion }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary" (click)="editar(e)">Editar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && (!especializaciones || especializaciones.length === 0)">
    No hay especializaciones registradas.
  </div>
</div>
