<div class="container mt-4">
  <h2 class="text-center mb-3">Listado de Medicamentos</h2>
  <button class="btn btn-success mb-3" (click)="nuevoMedicamento()">+ Nuevo Medicamento</button>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <table *ngIf="!loading" class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Presentación</th>
        <th>Fecha Compra</th>
        <th>Fecha Vencimiento</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of medicamentos">
        <td>{{ m.id }}</td>
        <td>{{ m.nombre }}</td>
        <td>{{ m.descripcion }}</td>
        <td>{{ m.presentacion }}</td>
        <td>{{ m.fechaCompra | date }}</td>
        <td>{{ m.fechaVence | date }}</td>
        <td>
          <button class="btn btn-primary btn-sm" (click)="editarMedicamento(m.id!)">Editar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
