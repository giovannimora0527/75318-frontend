<ngx-spinner type="ball-fussion" size="medium" color="#fff">
  <p>{{ titleSpinner }}</p>
</ngx-spinner>

<div class="container audit-container">

  <!-- Card principal -->
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center header-audit">
      <h3 class="mb-0 text-dark">
        <i class="fa fa-clipboard-list"></i>
        &nbsp;Auditoría del Sistema
      </h3>
      <button class="btn btn-outline-primary" (click)="limpiarFiltros()">
        <i class="fa fa-broom"></i>
        &nbsp;Limpiar filtros
      </button>
    </div>

    <div class="card-body">

      <div class="card-body">
        <!-- Filtros -->
        <form [formGroup]="filtroForm" class="row g-3 filters">
          <div class="col-md-3">
            <label class="form-label">Usuario</label>
            <input type="text" formControlName="username" class="form-control" placeholder="Filtrar por usuario"
              (keyup)="aplicarFiltros()">
          </div>
          <div class="col-md-3">
            <label class="form-label">Tipo de Evento</label>
            <select formControlName="eventType" class="form-select" (change)="aplicarFiltros()">
              <option value="">Todos</option>
              <option *ngFor="let e of eventTypes" [value]="e">{{ e }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Desde</label>
            <input type="datetime-local" formControlName="start" class="form-control" (change)="aplicarFiltros()">
          </div>
          <div class="col-md-3">
            <label class="form-label">Hasta</label>
            <input type="datetime-local" formControlName="end" class="form-control" (change)="aplicarFiltros()">
          </div>
        </form>

        <hr>

        <!-- Tabla -->
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="thead-custom">
              <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Evento</th>
                <th>Fecha</th>
                <th>Descripción</th>
                <th>IP</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let log of logs">
                <td>{{ log.id }}</td>
                <td>{{ log.usernameInput }}</td>
                <td>{{ log.eventType }}</td>
                <td>{{ log.timestamp | date:'yyyy-MM-dd HH:mm:ss' }}</td>
                <td>{{ log.description }}</td>
                <td>{{ log.ipAddress }}</td>
              </tr>
              <tr *ngIf="logs.length === 0">
                <td colspan="6" class="text-center text-muted">
                  No hay registros de auditoría.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Paginación -->
        <nav *ngIf="totalRegistros > size" class="mt-3">
          <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="page === 0">
              <button class="page-link" (click)="cambiarPagina(page - 1)">Anterior</button>
            </li>
            <li class="page-item" [class.disabled]="(page + 1) * size >= totalRegistros">
              <button class="page-link" (click)="cambiarPagina(page + 1)">Siguiente</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
