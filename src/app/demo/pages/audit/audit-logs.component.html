<div class="container py-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Logs de Auditoría</h5>
      <div class="d-flex">
        <input class="form-control form-control-sm me-2" placeholder="Usuario" [(ngModel)]="filtroUsuario">
        <input class="form-control form-control-sm me-2" placeholder="Evento" [(ngModel)]="filtroEvento">
        <button class="btn btn-sm btn-primary" (click)="aplicarFiltros()">Aplicar</button>
      </div>
    </div>
    <div class="card-body p-0">
      <div *ngIf="loading" class="p-3 text-center">Cargando...</div>
      <div *ngIf="!loading">
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>IP</th>
                <th>Evento</th>
                <th>Descripción</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let l of logs">
                <td>{{ l.timestamp | date:'yyyy-MM-dd HH:mm:ss' }}</td>
                <td>{{ l.username || '-' }}</td>
                <td>{{ l.ip || '-' }}</td>
                <td>{{ l.event }}</td>
                <td>{{ l.description || '-' }}</td>
              </tr>
              <tr *ngIf="logs.length === 0">
                <td colspan="5" class="text-center text-muted py-4">No hay registros.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
