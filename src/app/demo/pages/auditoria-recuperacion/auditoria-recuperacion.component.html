<div class="card">
  <div class="card-header">
    <h5>Auditoría Recuperación</h5>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-3">
        <input class="form-control" placeholder="Usuario" [formControl]="usernameControl" />
      </div>
      <div class="col-md-3">
        <input class="form-control" placeholder="Descripción" [formControl]="descripcionControl" />
      </div>
      <div class="col-md-2">
        <input type="datetime-local" class="form-control" [formControl]="startControl" />
      </div>
      <div class="col-md-2">
        <input type="datetime-local" class="form-control" [formControl]="endControl" />
      </div>
      <div class="col-md-1 d-flex align-items-center">
        <button class="btn btn-primary" (click)="buscar()" [disabled]="fechaError">Buscar</button>
      </div>
      <div class="col-md-1 d-flex align-items-center">
        <label class="me-2">Tamaño</label>
        <select class="form-select form-select-sm" [value]="size" (change)="setPageSize($any($event.target).value)">
          <option *ngFor="let s of pageSizes" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>
    <div *ngIf="fechaError" class="row mb-2">
      <div class="col-12">
        <div class="alert alert-danger p-2">{{ fechaError }}</div>
      </div>
    </div>

    <div *ngIf="loading" class="text-center mb-2">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <ng-container *ngIf="resultados && resultados.length > 0; else noResults">
      <div class="mat-table-responsive">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z0" style="width:100%;">

          <!-- Usuario Column -->
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef> Usuario </th>
            <td mat-cell *matCellDef="let r">{{ r.username }}</td>
          </ng-container>

          <!-- Fecha Column -->
          <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef> Fecha </th>
            <td mat-cell *matCellDef="let r">{{ r.fecha | date:'dd/MM/yyyy HH:mm:ss' }}</td>
          </ng-container>

          <!-- Descripción Column -->
          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef> Descripción </th>
            <td mat-cell *matCellDef="let r">{{ r.descripcion }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [length]="totalElements" [pageSize]="size" [pageSizeOptions]="pageSizes" (page)="onPageChange($event)"></mat-paginator>
      </div>
    </ng-container>
    <ng-template #noResults>
      <div class="alert alert-info">No hay registros de recuperación.</div>
    </ng-template>
  </div>
</div>
