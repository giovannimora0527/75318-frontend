<p>receta-form works!</p>

<div class="container">
  <h2>Nueva Receta</h2>
  <form [formGroup]="recetaForm" (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="citaId">Cita (ID)</label>
      <input id="citaId" formControlName="citaId" class="form-control" type="number">
      <div *ngIf="f.citaId.touched && f.citaId.invalid" class="text-danger">La cita es requerida.</div>
    </div>

    <div class="form-group">
      <label for="medicamentoId">Medicamento (ID)</label>
      <input id="medicamentoId" formControlName="medicamentoId" class="form-control" type="number">
      <div *ngIf="f.medicamentoId.touched && f.medicamentoId.invalid" class="text-danger">El medicamento es requerido.</div>
    </div>

    <div class="form-group">
      <label for="dosis">Dosis</label>
      <input id="dosis" formControlName="dosis" class="form-control" type="text">
      <div *ngIf="f.dosis.touched && f.dosis.invalid" class="text-danger">La dosis es requerida (máx 200).</div>
    </div>

    <div class="form-group">
      <label for="indicaciones">Indicaciones</label>
      <textarea id="indicaciones" formControlName="indicaciones" class="form-control"></textarea>
    </div>

    <button class="btn btn-success" type="submit" [disabled]="loading">Guardar</button>
    <button class="btn btn-secondary" routerLink="/recetas" type="button">Cancelar</button>
  </form>
</div>
