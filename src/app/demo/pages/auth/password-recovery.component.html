<div class="container py-4">
  <div class="card mx-auto" style="max-width:520px">
    <div class="card-header">
      <h5 class="mb-0">Recuperación de contraseña</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" formControlName="username" [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched">
          <div class="invalid-feedback" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
            El nombre de usuario es obligatorio.
          </div>
        </div>
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary" [disabled]="submitting">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
            Enviar instrucciones
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
