<p>historia works!</p>
<ngx-spinner type="ball-fussion" size="medium" color="#fff">
  <p>{{ titleSpinner }}</p>
</ngx-spinner>

<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">
          <i class="fa fa-medkit"></i>
          &nbsp;Lista de historias clínicas
        </h3>
        <button class="btn btn-outline-primary" (click)="abrirNuevoHistoria()">
          <i class="fa fa-plus"></i>
          Nueva historia
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Paciente</th>
              <th>Fecha creación</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody *ngIf="historias?.length > 0">
            <tr *ngFor="let historia of historias">
              <td>{{ historia.id }}</td>
              <td>{{ historia.PacienteId }}</td>
              <td>{{ historia.fechaCreacion | date:'yyyy-MM-dd' }}</td>
              <td>
                <button
                  type="button"
                  class="btn btn-outline-primary btn-sm"
                  title="Editar historia"
                  (click)="abrirEditarHistoria(historia)"
                >
                  <i class="fa fa-edit"></i>
                </button>
              </td>
            </tr>
          </tbody>

          <tbody *ngIf="historias?.length === 0">
            <tr>
              <td colspan="4" class="text-center">No hay historias disponibles.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ==============================
     MODAL CREAR / EDITAR HISTORIA
     ============================== -->
<div class="modal fade" id="modalCrearHistoria" tabindex="-1" aria-labelledby="modalCrearHistoriaLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalCrearHistoriaLabel">
          {{ titleModal }}
        </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="form">

          <!-- Paciente -->
          <div class="mb-3">
            <label for="PacienteId" class="form-label">Paciente</label>
            <input
              type="text"
              id="PacienteId"
              class="form-control"
              placeholder="Ingrese el id del paciente"
              formControlName="PacienteId"
            />
            <div *ngIf="form.get('PacienteId')?.touched && form.get('PacienteId')?.hasError('required')" class="text-danger">
              El paciente es obligatorio.
            </div>
          </div>

          <!-- Fecha de creación -->
          <div class="mb-3">
            <label for="fechaCreacion" class="form-label">Fecha de creación</label>
            <input
              type="date"
              id="fechaCreacion"
              class="form-control"
              formControlName="fechaCreacion"
            />
            <div *ngIf="form.get('fechaCreacion')?.touched && form.get('fechaCreacion')?.hasError('required')" class="text-danger">
              La fecha es obligatoria.
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" (click)="guardarHistoria()">
          {{ titleBoton }}
        </button>
      </div>

    </div>
  </div>
</div>
