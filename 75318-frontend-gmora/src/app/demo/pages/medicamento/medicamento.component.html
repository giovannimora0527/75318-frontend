<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Gestión de Medicamentos</h4>
  <button class="btn btn-primary" (click)="abrirNuevoMedicamento()">
    Nuevo Medicamento
  </button>
</div>

<!-- Tabla de medicamentos -->
<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Presentación</th>
        <th scope="col">Fecha Compra</th>
        <th scope="col">Fecha Vencimiento</th>
        <th scope="col" class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of medicamentos">
        <td>{{ m.nombre }}</td>
        <td>{{ m.presentacion || '-' }}</td>
        <td>{{ m.fechaCompra || '-' }}</td>
        <td>{{ m.fechaVence || '-' }}</td>
        <td class="text-center">
          <button
            class="btn btn-sm btn-info me-1"
            (click)="abrirEditarMedicamento(m)"
          >
            <i class="feather icon-edit"></i> Editar
          </button>
        </td>
      </tr>
      <tr *ngIf="!medicamentos || medicamentos.length === 0">
        <td colspan="5" class="text-center text-muted py-3">
          No hay medicamentos registrados
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal para Crear/Editar Medicamento -->
<div
  class="modal fade"
  id="modalMedicamento"
  tabindex="-1"
  aria-labelledby="modalMedicamentoLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalMedicamentoLabel">
          {{ titleModal }}
        </h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
        <div class="row">
          <div class="col">
            <form [formGroup]="form" (ngSubmit)="guardarMedicamento()">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  id="nombre"
                  type="text"
                  class="form-control"
                  formControlName="nombre"
                  placeholder="Ingrese el nombre del medicamento"
                />
                <div
                  *ngIf="
                    form.get('nombre')?.touched &&
                    form.get('nombre')?.invalid
                  "
                  class="text-danger small"
                >
                  El nombre es obligatorio
                </div>
              </div>

              <div class="mb-3">
                <label for="presentacion" class="form-label">Presentación</label>
                <input
                  id="presentacion"
                  type="text"
                  class="form-control"
                  formControlName="presentacion"
                  placeholder="Ejemplo: Tabletas, Jarabe..."
                />
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="fechaCompra" class="form-label">Fecha Compra</label>
                  <input
                    id="fechaCompra"
                    type="date"
                    class="form-control"
                    formControlName="fechaCompra"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="fechaVence" class="form-label">Fecha Vencimiento</label>
                  <input
                    id="fechaVence"
                    type="date"
                    class="form-control"
                    formControlName="fechaVence"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea
                  id="descripcion"
                  class="form-control"
                  formControlName="descripcion"
                  rows="3"
                  placeholder="Ingrese una breve descripción del medicamento"
                ></textarea>
              </div>

              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  (click)="closeModal()"
                >
                  Cerrar
                </button>
                <button type="submit" class="btn btn-primary">
                  {{ titleBoton }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
