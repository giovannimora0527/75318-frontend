<!-- src/app/modules/auditoria/auditoria.component.html -->
<ngx-spinner type="ball-fussion" size="medium" color="#fff">
  <p>{{ titleSpinner }}</p>
</ngx-spinner>

<div class="container">
  <div class="card">
    <div class="card-header">
      <h3 class="mb-0">
        <i class="fa fa-clipboard-list"></i>
        &nbsp;Registros de Auditoría
      </h3>
    </div>
    <div class="card-body">
      <!-- Filtros -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <label class="form-label">Fecha desde</label>
          <input type="date" class="form-control" [(ngModel)]="filtroFechaDesde">
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha hasta</label>
          <input type="date" class="form-control" [(ngModel)]="filtroFechaHasta">
        </div>
        <div class="col-md-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="filtroUsuario" placeholder="Nombre de usuario">
        </div>
        <div class="col-md-3">
          <label class="form-label">Evento</label>
          <select class="form-select" [(ngModel)]="filtroEvento">
            <option value="">Todos los eventos</option>
            <option *ngFor="let evento of eventosDisponibles" [value]="evento">
              {{ evento }}
            </option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-outline-secondary me-2" (click)="limpiarFiltros()">
          <i class="fa fa-eraser"></i> Limpiar
        </button>
        <button class="btn btn-primary" (click)="aplicarFiltros()">
          <i class="fa fa-filter"></i> Aplicar filtros
        </button>
      </div>

      <!-- Tabla de logs -->
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-light">
            <tr>
              <th>Fecha y Hora</th>
              <th>Usuario</th>
              <th>Evento</th>
              <th>Estado</th>
              <th>IP</th>
              <th>Detalles</th>
            </tr>
          </thead>
          <tbody *ngIf="logsFiltrados.length > 0; else noLogs">
            <tr *ngFor="let log of logsFiltrados">
              <td>{{ formatearFecha(log.fechaHora) }}</td>
              <td>{{ log.usernameIngresado }}</td>
              <td><span class="badge bg-info">{{ log.motivo }}</span></td>
              <td>{{ getIconoExito(log.exitoso) }}</td>
              <td>{{ log.ipAddress }}</td>
              <td>
                <small *ngIf="log.descripcionError">{{ log.descripcionError }}</small>
                <small *ngIf="!log.descripcionError" class="text-muted">-</small>
              </td>
            </tr>
          </tbody>
          <ng-template #noLogs>
            <tr>
              <td colspan="6" class="text-center">No hay registros de auditoría.</td>
            </tr>
          </ng-template>
        </table>
      </div>
    </div>
  </div>
</div>
