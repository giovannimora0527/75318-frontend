<div class="container mt-4">
  <h2 class="text-center">{{ editMode ? 'Editar Medicamento' : 'Nuevo Medicamento' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="mt-4">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" formControlName="nombre" />
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" rows="3" formControlName="descripcion"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Presentación</label>
      <input type="text" class="form-control" formControlName="presentacion" />
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de Compra</label>
        <input type="date" class="form-control" formControlName="fechaCompra" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de Vencimiento</label>
        <input type="date" class="form-control" formControlName="fechaVence" />
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">
        {{ editMode ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="btn btn-secondary" routerLink="/medicamentos">Cancelar</button>
    </div>
  </form>
</div>
