<div class="container mt-4">

  <h2 class="mb-3">Gestión de Usuarios</h2>

  <!-- 🔥 Botón SOLO PARA ADMIN -->
  <button 
    class="btn btn-primary mb-3"
    *ngIf="isAdmin"
    (click)="abrirNuevoUsuario()">
    Crear Usuario
  </button>

  <!-- Tabla de usuarios -->
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Rol</th>
        <th>Activo</th>
        <th *ngIf="isAdmin">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let usuario of usuarios">
        <td>{{ usuario.id }}</td>
        <td>{{ usuario.username }}</td>
        <td>{{ usuario.rol }}</td>
        <td>
          <span class="badge bg-success" *ngIf="usuario.activo">Activo</span>
          <span class="badge bg-danger" *ngIf="!usuario.activo">Inactivo</span>
        </td>

        <!-- 🔥 Acciones SOLO ADMIN -->
        <td *ngIf="isAdmin">
          <button class="btn btn-warning btn-sm" (click)="abrirEditarUsuario(usuario)">Editar</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>

<!-- Modal Crear/Editar Usuario -->
<div class="modal fade" id="modalCrearUsuario" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ titleModal }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <div class="modal-body">

        <form [formGroup]="form">

          <div class="mb-3">
            <label>Username</label>
            <input type="text" class="form-control" formControlName="username">
          </div>

          <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" formControlName="password">
          </div>

          <div class="mb-3">
            <label>Rol</label>
            <select class="form-control" formControlName="rol">
              <option value="">Seleccione...</option>
              <option value="ADMIN">ADMIN</option>
              <option value="MEDICO">MEDICO</option>
              <option value="PACIENTE">PACIENTE</option>
            </select>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" formControlName="activo">
            <label class="form-check-label">Activo</label>
          </div>

        </form>

      </div>

      <div class="modal-footer">

        <button class="btn btn-secondary" (click)="closeModal()">Cerrar</button>

        <!-- 🔥 Guardar SOLO ADMIN -->
        <button 
          class="btn btn-primary"
          *ngIf="isAdmin"
          (click)="guardarUsuario()">
          {{ titleBoton }}
        </button>

      </div>

    </div>
  </div>
</div>
